# docker-compose.yml para toDus S3 Uploader Bot
# Uso:
#   1. cp .env.example .env  && rellenar credenciales
#   2. docker compose up -d --build
#   3. Ver logs:        docker compose logs -f
#   4. Parar:           docker compose down

services:
  s3-todus-bot:
    build: .
    image: s3-todus-bot:latest
    container_name: s3-todus-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      # Sesión de Pyrogram + settings.json persistente.
      - ./data:/app/data
      # Temporales (se borran al subir, pero útil para depurar).
      - ./downloads:/app/downloads
    # Healthcheck opcional: el proceso main responde si está vivo.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -u bot.py' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Límites de recursos suaves (ajustar según carga).
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
